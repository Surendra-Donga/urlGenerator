spring.application.name=URLGenerator

# Database Configuration (Detects PostgreSQL or MySQL automatically)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/url_shortener?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:rootpassword}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Port
server.port=${PORT:8080}

# Public endpoints
springdoc.swagger-ui.path=/swagger-ui.html
